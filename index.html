  reviveTitle.textContent='WATCH AN AD TO REVIVE?';
  reviveText.textContent='You can revive once per run with 50% HP.';
  watchAdBtn.disabled=false;

  reviveBox.style.display='block';

  ih=180;

function pt(x,y,vx,vy,l,col,s,sm){

    x:x,
    y:y,
    vx:vx,
    vy:vy,
    life:l,
    max:l,

}

function el(x,y,rx,ry,col,r){
  g.fillStyle=col;
  g.beginPath();
  g.ellipse(x,y,rx,ry,r||0,0,7);
  g.fill();
}

function cc(x,y,r,col){

  g.beginPath();
  g.arc(x,y,r,0,7);

}

function splat(x,y){

    x:x,

  });

  if(D.length>60)D.shift();
}

function hit(z,d){
  z.hp-=d;

  if(z.hp<=0&&!z.dead){
    z.dead=1;
    score++;

    if(level==2&&z.boss){

      bossSpawned=2;
      bossCutscene=180;
      level2PostBossSpawned=0;

      X.push({
        x:z.x,
        y:z.y,
        t:0
      });

      for(let i=0;i<45;i++){
        const a=Math.random()*6.283;
        const s=1+Math.random()*6;

        pt(
          z.x,
          z.y,
          Math.cos(a)*s,
          Math.sin(a)*s,
          25+Math.random()*25|0,
          Math.random()<.5?'#ff9d00':'#ffd86b',
          3+Math.random()*4,
          0
        );
      }

    }else if(level==2){

      level2Kills++;

      if(level2Kills>=55&&!bossSpawned){
        spawnBoss();
      }
    }

    F.push({
      x:z.x,
      y:z.y,
      t:0
    });

    splat(z.x,z.y);

    if(score>=100&&level<2){
      activateLevel2();
    }
  }
}

function activateLevel2(){

  levelBanner=180;

  bossSpawned=0;
  bossCutscene=0;
  level2Kills=0;

  BLD=[];
  O=[];
  G=[];
  apples=[];

  let n=0;

  while(O.length<30&&n++<1000){
    const x=55+Math.random()*(w-110);
    const y=55+Math.random()*(h-110);
    const roll=Math.random();

    const t=
      roll<.52?0:
      roll<.82?1:
      2;

    const r=
      t==0
        ?18+Math.random()*13
        :t==1
          ?15+Math.random()*9
          :24+Math.random()*13;

    if(
      Math.hypot(x-p.x,y-p.y)>170&&
      O.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+42)
    ){
      O.push({
        x:x,
        y:y,
        r:r,
        t:t,
        s:Math.random()*6
      });
    }
  }

  O.forEach(o=>{
    if(o.t==0){
      const count=2+Math.random()*2|0;

      for(let i=0;i<count;i++){
        const a=Math.random()*6.283;
        const r=18+Math.random()*17;

        apples.push({
          x:o.x+Math.cos(a)*r,
          y:o.y+Math.sin(a)*r,
          got:0
        });
      }
    }
  });

  for(let i=0;i<360;i++){
    G.push({
      x:Math.random()*w,
      y:Math.random()*h,
      a:Math.random()*.8-.4,
      l:Math.random()<.55
    });
  }

  WPN=[];
}

function col(q,r){
  O.forEach(o=>{
    const dx=q.x-o.x;
    const dy=q.y-o.y;
    const d=Math.hypot(dx,dy);
    const mm=o.r+r;

    if(d<mm&&d>0){
      q.x=o.x+dx/d*mm;
      q.y=o.y+dy/d*mm;
    }
  });
}

  level2Spawned=0;
  level2PostBossSpawned=0;

  while(O.length<22&&n++<600){

function spawnW(){

function spawnUpgrade(){
  const owned=[];

  for(let i=0;i<5;i++){
    if(own[i]&&gunMult[i]<2){
      owned.push(i);
    }
  }

  if(!owned.length)return false;

  const pool=
    T<2400
      ?owned.filter(i=>i<=1)
      :T<4200
        ?owned.filter(i=>i<=2)
        :owned;

  const choices=pool.length?pool:owned;
  const type=choices[Math.random()*choices.length|0];

  let x,y,ok=false;

  for(let n=0;n<300;n++){
    x=70+Math.random()*(w-140);
    y=70+Math.random()*(h-140);

    if(
      Math.hypot(x-p.x,y-p.y)>170&&
      O.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+35)&&
      WPN.every(o=>Math.hypot(o.x-x,o.y-y)>70)&&
      upgrades.every(o=>Math.hypot(o.x-x,o.y-y)>70)
    ){
      ok=true;
      break;
    }
  }

  if(!ok)return false;

  upgrades.push({
    x:x,
    y:y,
    t:type,
    got:0
  });

  return true;
}

/* ---------- walls / apples ---------- */

function wallAt(x,y,ang,make=false){
  const len=150;
  const th=44;

  return {
    x:x,
    y:y,
    a:ang,
    len:len,
    th:th,
    hp:220,
    mhp:220
  };
}

function wallRect(q){
  const ux=Math.cos(q.a);
  const uy=Math.sin(q.a);
  const vx=-uy;
  const vy=ux;

  const pts=[
    {
      x:q.x-ux*q.len/2-vx*q.th/2,
      y:q.y-uy*q.len/2-vy*q.th/2
    },
    {
      x:q.x+ux*q.len/2-vx*q.th/2,
      y:q.y+uy*q.len/2-vy*q.th/2
    },
    {
      x:q.x+ux*q.len/2+vx*q.th/2,
      y:q.y+uy*q.len/2+vy*q.th/2
    },
    {
      x:q.x-ux*q.len/2+vx*q.th/2,
      y:q.y-uy*q.len/2+vy*q.th/2
    }
  ];

  return pts;
}

function pointWallDist(x,y,q){
  const dx=x-q.x;
  const dy=y-q.y;
  const co=Math.cos(q.a);
  const si=Math.sin(q.a);

  const lx=dx*co+dy*si;
  const ly=-dx*si+dy*co;

  const cx=Math.max(
    -q.len/2,
    Math.min(q.len/2,lx)
  );

  const cy=Math.max(
    -q.th/2,
    Math.min(q.th/2,ly)
  );

  return Math.hypot(lx-cx,ly-cy);
}

function collWall(q,r){
  BLD.forEach(o=>{
    const d=pointWallDist(q.x,q.y,o);

    if(d<r){
      const a=Math.atan2(q.y-o.y,q.x-o.x);
      const push=r-d;

      q.x+=Math.cos(a)*push;
      q.y+=Math.sin(a)*push;
    }
  });
}

function canBuild(q){
  if(Math.hypot(q.x-p.x,q.y-p.y)<35)return false;

  if(
    q.x<35||
    q.x>w-35||
    q.y<35||
    q.y>h-35
  )return false;

  if(
    O.some(o=>
      pointWallDist(o.x,o.y,q)<o.r+q.th/2+4
    )
  )return false;

  if(
    BLD.some(o=>
      pointWallDist(q.x,q.y,o)<(q.len+o.len)/3
    )
  )return false;

  return true;
}

function eatApple(){
  if(dead||appleCount<=0)return;

  appleCount--;

  hp=Math.min(100,hp+30);
  ih=Math.max(ih,12);

  const radius=135;

  e.forEach(z=>{
    if(
      !z.dead&&
      Math.hypot(z.x-p.x,z.y-p.y)<=radius
    ){
      hit(z,999999);
    }
  });

  AEX.push({
    x:p.x,
    y:p.y,
    t:0,
    r:radius
  });

  for(let i=0;i<32;i++){
    const a=Math.random()*6.283;
    const s=2+Math.random()*6;

    pt(
      p.x,
      p.y,
      Math.cos(a)*s,
      Math.sin(a)*s,
      20+Math.random()*18|0,
      '#7ccf4a',
      3+Math.random()*3,
      0
    );
  }
}

/* ---------- shooting ---------- */

function muzzle(a,n){
  const mx=p.x+Math.cos(a)*52;
  const my=p.y+Math.sin(a)*52;

  for(let i=0;i<n;i++){
    const s=(Math.random()-.5)*.7;
    const v=2+Math.random()*5;

    pt(
      mx,
      my,
      Math.cos(a+s)*v,
      Math.sin(a+s)*v,
      8+Math.random()*6|0,
      Math.random()<.5?'#ffb300':'#fff2a8',
      2+Math.random()*2,
      0
    );
  }

  const side=a+1.57;
  const sv=2+Math.random()*1.5;

  pt(
    p.x+Math.cos(a)*18,
    p.y+Math.sin(a)*18,
    Math.cos(side)*sv,
    Math.sin(side)*sv,
    32,
    '#d4a017',
    2.5,
    0
  );
}

function shoot(){
  const a=Math.atan2(
    m.y-p.y,
    m.x-p.x
  );

  b.push({
    x:p.x+Math.cos(a)*52,
    y:p.y+Math.sin(a)*52,
    vx:Math.cos(a)*14,
    vy:Math.sin(a)*14,
    life:999,
    t:1,
    dmg:gunMult[0]
  });

  fl=3;
  muzzle(a,5);
}

function smg(){
  const a=
    Math.atan2(
      m.y-p.y,
      m.x-p.x
    )+
    (Math.random()-.5)*.12;

  b.push({
    x:p.x+Math.cos(a)*52,
    y:p.y+Math.sin(a)*52,
    vx:Math.cos(a)*15,
    vy:Math.sin(a)*15,
    life:999,
    t:1,
    dmg:gunMult[3]
  });

  fl=2;
  muzzle(a,2);
  S=Math.max(S,1.5);
}

function homing(){
  const a=Math.atan2(
    m.y-p.y,
    m.x-p.x
  );

  b.push({
    x:p.x+Math.cos(a)*52,
    y:p.y+Math.sin(a)*52,
    vx:Math.cos(a)*12.5,
    vy:Math.sin(a)*12.5,
    life:999,
    t:1,
    homing:1,
    dmg:gunMult[4]
  });

  fl=3;
  muzzle(a,3);
}

function blast(){
  const a0=Math.atan2(
    m.y-p.y,
    m.x-p.x
  );

  for(let i=0;i<10;i++){
    const a=
      a0+
      (Math.random()-.5)*.55;

    const v=11+Math.random()*5;

    b.push({
      x:p.x+Math.cos(a0)*52,
      y:p.y+Math.sin(a0)*52,
      vx:Math.cos(a)*v,
      vy:Math.sin(a)*v,
      life:32+Math.random()*10|0,
      t:0,
      dmg:gunMult[1]
    });
  }

  fl=6;
  S=Math.max(S,7);

  muzzle(a0,16);

c.oncontextmenu=q=>q.preventDefault();

c.onmousemove=q=>{

  m={
    x:(q.clientX-r.left)/Z,
    y:(q.clientY-r.top)/Z
  };
};

c.onmousedown=q=>{
  if(dead||q.button!=0)return;
  md=1;
};

onmouseup=()=>{
  md=0;
};

onblur=()=>{
  md=0;
  k={};
};

onkeydown=q=>{
  const n=q.key.toLowerCase();

  if(
    n.indexOf('arrow')==0||
    n==' '
  ){
    q.preventDefault();
  }

  k[n]=1;

  if(
    n=='b'&&
    !q.repeat&&
    !dead
  ){
    buildHeld=1;
  }

  if(dead){
    if(n>='1'&&n<='3'){
      ci=n-1;
      rs();
    }else if(n=='enter'||n==' '){
      rs();
    }

    return;
  }

  if(
    n=='e'&&
    !q.repeat&&
    L<=0
  ){
    for(let i=1;i<=4;i++){
      const t=(wp+i)%4;

      if(own[t]){
        wp=t;
        break;
      }
    }
  }

  if(
    n=='f'&&
    !q.repeat
  ){
    eatApple();
  }
};

onkeyup=q=>{
  const n=q.key.toLowerCase();

  k[n]=0;

  if(
    n=='b'&&
    buildHeld
  ){
    buildHeld=0;

    if(
      buildPreview&&
      canBuild(buildPreview)
    ){
      BLD.push(buildPreview);
      buildPreview=null;
    }else{
      buildPreview=null;
    }
  }
};

c.onclick=q=>{
  if(!dead)return;

  const r=c.getBoundingClientRect();
  const mx=q.clientX-r.left;
  const my=q.clientY-r.top;
  const cy=c.height/2;
  const bx=c.width/2-325;

  for(let i=0;i<3;i++){
    const x=bx+i*150;

    if(
      mx>x&&
      mx<x+130&&
      my>cy-40&&
      my<cy+90
    ){
      ci=i;
      rs();
    }
  }
};

/* ---------- zombie spawning ---------- */

function spawnBoss(){
  bossSpawned=1;
  bossCutscene=0;

  let x,y;

  for(let n=0;n<100;n++){
    const side=Math.random()*4|0;

    if(side==0){
      x=-70;
      y=Math.random()*h;
    }else if(side==1){
      x=w+70;
      y=Math.random()*h;
    }else if(side==2){
      x=Math.random()*w;
      y=-70;
    }else{
      x=Math.random()*w;
      y=h+70;
    }

    if(
      Math.hypot(x-p.x,y-p.y)>300
    )break;
  }

  e.push({
    x:x,
    y:y,
    ty:3,
    hp:180,
    mh:180,
    ar:90,
    wk:0,
    sv:.35,
    sh:'#4a3828',
    sk:'#b79b72',
    boss:1
  });
}

setInterval(()=>{
  if(dead||bossCutscene>0)return;

  if(
    level==1&&
    totalSpawned>=120
  )return;

  if(level==2){

    if(
      bossSpawned===0&&
      level2Spawned>=55
    )return;

    if(bossSpawned===1)return;

    if(
      bossSpawned===2&&
      level2PostBossSpawned>=100
    )return;
  }

  const side=Math.random()*4|0;
  let x,y;

  if(side==0){
    x=-40;
    y=Math.random()*h;
  }else if(side==1){
    x=w+40;
    y=Math.random()*h;
  }else if(side==2){
    x=Math.random()*w;
    y=-40;
  }else{
    x=Math.random()*w;
    y=h+40;
  }

  const r=Math.random();

  let ty=
    score>=10&&r<.2
      ?2
      :score>=4&&r<.5
        ?1
        :0;

  if(
    level==2&&
    Math.random()<.18
  ){
    ty=4;
  }

  let sh=SH[Math.random()*SH.length|0];
  let sk=SK[Math.random()*SK.length|0];

  let hp=Math.max(
    1,
    Math.ceil(
      (1+Math.floor(score/10))*
      (level==2?1.15:1)
    )
  );

  let sv=.75+Math.random()*.3;

  if(ty==1){
    sh='#5a5a6a';
    sk='#c9d0b8';

    hp=Math.max(
      1,
      Math.ceil(1*(level==2?1.15:1))
    );

    sv=
      1.5+
      Math.min(1.8,score/60);
  }

  if(ty==2){
    sh='#197a2b';
    sk='#8eea4f';

    hp=Math.max(
      2,
      Math.ceil(2*(level==2?1.15:1))
    );

    sv*=.85;
  }

  if(ty==4){
    sh='#7b4b2a';
    sk='#c58b58';

    hp=Math.max(
      6,
      Math.ceil(6*(level==2?1.15:1))
    );

    sv=.52+Math.random()*.12;
  }

  e.push({
    x:x,
    y:y,
    ty:ty,
    hp:hp,
    mh:hp,
    ar:70+Math.min(60,score),
    wk:Math.random()*6,
    sv:sv,
    sh:sh,
    sk:sk
  });

  totalSpawned++;

  if(level==2){
    if(bossSpawned===0){
      level2Spawned++;
    }else if(bossSpawned===2){
      level2PostBossSpawned++;
    }
  }

},1000);

  );

  /* apples around trees */

  apples.forEach(a=>{

    if(a.got)return;

    cc(
      a.x,
      a.y,
      7,
      '#b52b25'
    );

    cc(
      a.x-2,
      a.y-2,
      2,
      '#f36b55'
    );

    g.fillStyle='#4f8f2f';

    g.fillRect(
      a.x+2,
      a.y-8,
      5,
      2
    );

    if(
      !dead&&
      Math.hypot(
        p.x-a.x,
        p.y-a.y
      )<22
    ){
      a.got=1;
      appleCount++;
    }
  });

  apples=apples.filter(
    a=>!a.got
  );

  /* tree canopies */

  O.forEach(o=>{

    if(o.t)return;

    g.globalAlpha=.85;

    cc(
      o.x,
      o.y,
      36,
      '#1c5220'
    );

    cc(
      o.x-9,
      o.y-8,
      24,
      '#2a7a2c'
    );

    cc(
      o.x+11,
      o.y-4,
      17,
      '#3a9a3a'
    );

    cc(
      o.x+2,
      o.y+10,
      15,
      '#2a7a2c'
    );

    g.globalAlpha=1;
  });

  /* +1 popups */

  F.forEach(q=>{

    q.t++;

    g.globalAlpha=
      Math.max(
        0,
        1-q.t/40
      );

    g.fillStyle='#ffd400';
    g.font='bold 22px Arial';
    g.textAlign='center';

    g.fillText(
      '+1',
      q.x,
      q.y-q.t
    );

    g.globalAlpha=1;
  });

  X=X.filter(q=>q.t<30);
  F=F.filter(q=>q.t<40);

  R=R.filter(
    q=>!q.dead
  );

  e=e.filter(
    q=>!q.dead
  );

  b=b.filter(
    q=>
      !q.dead&&
      q.life>0&&
      q.x>-20&&
      q.x<w+20&&
      q.y>-20&&
      q.y<h+20
  );

  if(score>H)H=score;

  g.restore();

  if(
    ih>30&&
    !dead
  ){
    g.fillStyle='rgba(200,0,0,.15)';
    g.fillRect(
      0,
      0,
      c.width,
      c.height
    );
  }

  /* Boss defeated cutscene */

  if(bossCutscene>0){

    const progress=
      1-bossCutscene/180;

    g.fillStyle='rgba(0,0,0,.72)';

    g.fillRect(
      0,
      0,
      c.width,
      c.height
    );

    g.textAlign='center';

    g.fillStyle='#ffd86b';
    g.font='bold 42px Arial';

    g.fillText(
      'BOSS DEFEATED',
      c.width/2,
      c.height/2-25
    );

    g.fillStyle='white';
    g.font='20px Arial';

    g.fillText(
      'THE WILDLANDS CONTINUE...',
      c.width/2,
      c.height/2+15
    );

    g.fillStyle='rgba(255,255,255,.18)';

    g.fillRect(
      c.width/2-180,
      c.height/2+50,
      360,
      10
    );

    g.fillStyle='#7ccf4a';

    g.fillRect(
      c.width/2-180,
      c.height/2+50,
      360*progress,
      10
    );

    g.textAlign='left';
  }

  /* HUD */

  g.textAlign='left';

  g.fillStyle='rgba(0,0,0,.5)';

  g.fillRect(
    8,
    8,
    320,
    po>0?196:182
  );

  g.fillStyle='white';
  g.font='bold 22px Arial';

  g.fillText(
    'SCORE: '+score,
    15,
    32
  );

  g.fillStyle=
    level==2
      ?'#f2d39b'
      :'#7ccf4a';

  g.font='bold 14px Arial';

  g.fillText(
    'LEVEL: '+
    level+
    (
      level==2
        ?(
          bossSpawned===0
            ?'  PRE-BOSS: '+level2Spawned+'/55'
            :bossSpawned===1
              ?'  BOSS FIGHT'
              :bossCutscene>0
                ?'  BOSS DEFEATED'
                :'  AFTER BOSS: '+level2PostBossSpawned+'/100'
        )
        :''
    ),
    15,
    48
  );

  g.fillStyle='#ffd400';
  g.font='16px Arial';

  g.fillText(
    'BEST: '+H,
    15,
    66
  );

  g.fillStyle='#aaa';
  g.font='14px Arial';

  g.fillText(
    'PLAYER: '+playerName,
    15,
    83
  );

  g.fillStyle='white';
  g.font='bold 18px Arial';

  g.fillText(
    'WEAPON: '+
    WN[wp]+
    (
      own.filter(x=>x).length>1
        ?'  [E]'
        :''
    )+
    '  DMG x'+
    gunMult[wp],
    15,
    104
  );

  g.font='18px Arial';

  g.fillStyle=
    !own[2]
      ?'#888'
      :rc>0
        ?'#e74c3c'
        :'#2ecc71';

  g.fillText(
    !own[2]
      ?'ROCKET: NOT FOUND'
      :L>0
        ?'ROCKET: AIMING...'
        :rc>0
          ?'ROCKET: RELOADING'
          :'ROCKET: READY',
    15,
    130
  );

  if(po>0){

    g.fillStyle='#7ccf4a';

    g.fillText(
      'POISONED (slowed) '+
      (po/60).toFixed(1)+
      's',
      15,
      140
    );
  }

  g.fillStyle='white';
  g.font='18px Arial';

  g.fillText(
    'WASD = MOVE | E = SWAP | HOLD CLICK = FIRE | HOLD B + RELEASE = BUILD WALL | F = EAT APPLE',
    15,
    c.height-15
  );

  g.fillStyle='#ffd66b';
  g.font='bold 16px Arial';

  g.fillText(
    'APPLES: '+
    appleCount+
    '   HP: '+
    Math.ceil(hp)+
    '%',
    15,
    164
  );

  if(level==2&&!dead){

    g.fillStyle='rgba(70,40,20,.7)';

    g.fillRect(
      c.width/2-150,
      20,
      300,
      48
    );

    g.textAlign='center';

    g.fillStyle='#f2d39b';
    g.font='bold 24px Arial';

    g.fillText(
      'LEVEL 2',
      c.width/2,
      50
    );

    g.font='12px Arial';

    g.fillText(
      'THE WILDLANDS',
      c.width/2,
      64
    );

    g.textAlign='left';
  }

  /* start screen / death screen */

  nameBox.style.display=
    dead
      ?'flex'
      :'none';

  if(dead==2){
    hideRevivePopup();
  }

  if(dead){

    const st=dead==2;
    const cy=c.height/2;
    const cx=c.width/2-110;
    const bx=cx-215;

    g.fillStyle='rgba(0,0,0,.78)';

    g.fillRect(
      0,
      0,
      c.width,
      c.height
    );

    g.textAlign='center';

    g.fillStyle=
      st
        ?'#7ccf4a'
        :'#c0392b';

    g.font='bold 44px Arial';

    g.fillText(
      st
        ?'ZOMBIE SHOOTER'
        :'YOU DIED',
      cx,
      cy-130
    );

    g.fillStyle='white';
    g.font='20px Arial';

    g.fillText(
      st
        ?'You start with a pistol. Find guns, apples and build walls around trees!'
        :'SCORE: '+score+
          '   BEST: '+H+
          (
            score>0&&
            score==H
              ?'  (NEW BEST!)'
              :''
          ),
      cx,
      cy-92
    );

    g.fillStyle='#aaa';
    g.font='14px Arial';

    g.fillText(
      'CHOOSE YOUR SURVIVOR',
      cx,
      cy-62
    );

    for(let i=0;i<3;i++){

      const x=bx+i*150;
      const y=cy-40;

      g.fillStyle=
        i==ci
          ?'rgba(255,212,0,.15)'
          :'rgba(255,255,255,.07)';

      g.fillRect(
        x,
        y,
        130,
        130
      );

      g.strokeStyle=
        i==ci
          ?'#ffd400'
          :'#555';

      g.lineWidth=2;

      g.strokeRect(
        x,
        y,
        130,
        130
      );

      human(
        x+50,
        y+55,
        0,
        CH[i],
        fr*.2,
        1.5,
        0,
        0
      );

      g.textAlign='center';
      g.fillStyle='white';
      g.font='bold 14px Arial';

      g.fillText(
        CH[i].n,
        x+65,
        y+120
      );

      g.textAlign='left';
      g.fillStyle='#888';
      g.font='12px Arial';

      g.fillText(
        '['+(i+1)+']',
        x+6,
        y+16
      );
    }

    g.textAlign='center';
    g.fillStyle='white';
    g.font='16px Arial';

    g.fillText(
      st
        ?'ENTER YOUR USERNAME ABOVE, THEN CLICK A SURVIVOR'
        :'CLICK A SURVIVOR OR PRESS 1 / 2 / 3 TO RESTART',
      cx,
      cy+120
    );

    g.fillStyle='#aaa';
    g.font='13px Arial';

    g.fillText(
      'ENTER = PLAY AS '+CH[ci].n,
      cx,
      cy+144
    );

    g.fillStyle='#7ccf4a';
    g.font='bold 13px Arial';

    g.fillText(
      'USERNAME: '+playerName+'  (reload page to change)',
      cx,
      cy+166
    );

    /* scoreboard */

    const x0=cx+240;
    const y0=cy-140;

    const hl=
      !st&&
      SC.findIndex(
        q=>
          q.name===playerName&&
          q.score===score
      );

    g.fillStyle='rgba(255,255,255,.07)';

    g.fillRect(
      x0,
      y0,
      260,
      290
    );

    g.strokeStyle='#555';
    g.lineWidth=2;

    g.strokeRect(
      x0,
      y0,
      260,
      290
    );

    g.textAlign='center';
    g.fillStyle='#ffd400';
    g.font='bold 16px Arial';

    g.fillText(
      'TOP 10 SCORES',
      x0+130,
      y0+24
    );

    g.font='14px Arial';

    for(let i=0;i<10;i++){

      const row=SC[i];

      g.fillStyle=
        i==hl
          ?'#ffd400'
          :'white';

      g.textAlign='left';

      g.fillText(
        (i+1)+'.',
        x0+12,
        y0+52+i*22
      );

      g.fillText(
        row
          ?row.name
          :'-',
        x0+38,
        y0+52+i*22
      );

      g.textAlign='right';

      g.fillText(
        row
          ?row.score
          :'-',
        x0+242,
        y0+52+i*22
      );
    }

    g.textAlign='center';
    g.fillStyle='#7ccf4a';
    g.font='bold 15px Arial';

    g.fillText(
      'YOUR BEST: '+H,
      x0+130,
      y0+278
    );

    g.textAlign='left';
  }

  requestAnimationFrame(game);
}

game();

})();
</script>
</body>
</html>
