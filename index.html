<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie Shooter</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0b}</style>
</head>
<body>
<script>
(()=>{
const c=document.createElement('canvas');
c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair';
document.body.appendChild(c);
const g=c.getContext('2d');
const Z=.8;      // zoom
const HOLD=15;   // shotgun charge frames
const WN=['PISTOL','SHOTGUN','ROCKET LAUNCHER'];
let w=0,h=0,p={x:0,y:0},e=[],b=[],k={},score=0,H=0,dead=0,R=[],X=[],P=[],F=[],D=[],S=0,rc=0,L=0,T=0,fl=0,wk=0,fr=0,ci=0,md=0,hd=0,m={x:0,y:0},wp=0,po=0,O=[],G=[],hp=100,ih=0;
const CH=[
{n:'SOLDIER',shirt:'#4b5a32',vest:'#3a4526',pants:'#3b4028',helm:'#3d4a2a',skin:'#e0ac82',boot:'#1a1a1a'},
{n:'SURVIVOR',shirt:'#8e2b2b',pants:'#2f4a6b',hair:'#5a3a1e',skin:'#f0c39a',pack:'#5d4a2f',boot:'#3b2a1a'},
{n:'SWAT',shirt:'#1f2a3a',vest:'#0e141b',pants:'#141a22',helm:'#0d1117',skin:'#c68e62',boot:'#000'}];
const SH=['#5d4037','#37474f','#4a5a3a','#6d4c41','#455a64','#5a5a5a'];
const SK=['#8fa67a','#9aa88a','#7f9a72','#a3ad93'];

function pt(x,y,vx,vy,l,col,s,sm){P.push({x:x,y:y,vx:vx,vy:vy,life:l,max:l,col:col,s:s,sm:sm})}
function el(x,y,rx,ry,col,r){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,r||0,0,7);g.fill()}
function cc(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function splat(x,y){D.push({x:x,y:y,r:7+Math.random()*9,a:Math.random()*6.28});if(D.length>60)D.shift()}
function hit(z,d){z.hp-=d;if(z.hp<=0&&!z.dead){z.dead=1;score++;F.push({x:z.x,y:z.y,t:0});splat(z.x,z.y)}}
function col(q,r){O.forEach(o=>{const dx=q.x-o.x,dy=q.y-o.y,d=Math.hypot(dx,dy),mm=o.r+r;if(d<mm&&d>0){q.x=o.x+dx/d*mm;q.y=o.y+dy/d*mm}})}
function gen(){
  O=[];G=[];let n=0;
  while(O.length<22&&n++<600){
    const x=60+Math.random()*(w-120),y=60+Math.random()*(h-120),t=Math.random()<.6?0:1,r=t?18+Math.random()*14:15;
    if(Math.hypot(x-w/2,y-h/2)>170&&O.every(o=>Math.hypot(o.x-x,o.y-y)>o.r+r+50))O.push({x:x,y:y,r:r,t:t,s:Math.random()*6});
  }
  for(let i=0;i<300;i++)G.push({x:Math.random()*w,y:Math.random()*h,a:Math.random()*.8-.4,l:Math.random()<.4});
}
function sz(){c.width=innerWidth;c.height=innerHeight;w=c.width/Z;h=c.height/Z}
function rs(){dead=0;score=0;T=0;L=0;S=0;fl=0;rc=0;md=0;hd=0;po=0;hp=100;ih=0;e=[];R=[];X=[];b=[];P=[];F=[];D=[];p={x:w/2,y:h/2};gen()}
sz();
p={x:w/2,y:h/2};m={x:w/2+100,y:h/2};gen();
onresize=sz;

/* ---------- shooting ---------- */
function muzzle(a,n){
  const mx=p.x+Math.cos(a)*52,my=p.y+Math.sin(a)*52;
  for(let i=0;i<n;i++){
    const s=(Math.random()-.5)*.7,v=2+Math.random()*5;
    pt(mx,my,Math.cos(a+s)*v,Math.sin(a+s)*v,8+Math.random()*6|0,Math.random()<.5?'#ffb300':'#fff2a8',2+Math.random()*2,0);
  }
  const side=a+1.57,sv=2+Math.random()*1.5;
  pt(p.x+Math.cos(a)*18,p.y+Math.sin(a)*18,Math.cos(side)*sv,Math.sin(side)*sv,32,'#d4a017',2.5,0);
}
function shoot(){
  const a=Math.atan2(m.y-p.y,m.x-p.x);
  b.push({x:p.x+Math.cos(a)*52,y:p.y+Math.sin(a)*52,vx:Math.cos(a)*14,vy:Math.sin(a)*14,life:999,t:1});
  fl=3;muzzle(a,5);
}
function blast(){
  const a0=Math.atan2(m.y-p.y,m.x-p.x);
  for(let i=0;i<10;i++){
    const a=a0+(Math.random()-.5)*.55,v=9+Math.random()*4;
    b.push({x:p.x+Math.cos(a0)*52,y:p.y+Math.sin(a0)*52,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:22+Math.random()*8|0,t:0});
  }
  fl=6;S=Math.max(S,7);muzzle(a0,16);
  p.x-=Math.cos(a0)*8;p.y-=Math.sin(a0)*8;
}

/* ---------- input ---------- */
c.oncontextmenu=q=>q.preventDefault();
c.onmousemove=q=>{const r=c.getBoundingClientRect();m={x:(q.clientX-r.left)/Z,y:(q.clientY-r.top)/Z}};
c.onmousedown=q=>{
  if(dead||q.button!=0)return;
  md=1;hd=0;
  if(wp==0)shoot();
  else if(wp==2&&rc<=0&&L<=0){L=25;rc=90}
};
onmouseup=q=>{
  if(md&&!dead&&q.button==0&&wp==1&&hd>=HOLD)blast();
  md=0;hd=0;
};
onblur=()=>{md=0;hd=0;k={}};
onkeydown=q=>{
  const n=q.key.toLowerCase();
  if(n.indexOf('arrow')==0||n==' ')q.preventDefault();
  k[n]=1;
  if(dead){if(n>='1'&&n<='3'){ci=n-1;rs()}return}
  if(n=='e'&&!q.repeat&&L<=0){wp=(wp+1)%3;hd=0}
};
onkeyup=q=>{k[q.key.toLowerCase()]=0};
c.onclick=q=>{
  if(!dead)return;
  const r=c.getBoundingClientRect(),mx=q.clientX-r.left,my=q.clientY-r.top,cy=c.height/2,bx=c.width/2-215;
  for(let i=0;i<3;i++){const x=bx+i*150;if(mx>x&&mx<x+130&&my>cy-40&&my<cy+90){ci=i;rs()}}
};

/* ---------- zombie spawning (3 types) ---------- */
setInterval(()=>{
  if(dead)return;
  const s=Math.random()*4|0;let x,y;
  if(s==0){x=-40;y=Math.random()*h}else if(s==1){x=w+40;y=Math.random()*h}
  else if(s==2){x=Math.random()*w;y=-40}else{x=Math.random()*w;y=h+40}
  const r=Math.random(),ty=score>=10&&r<.2?2:score>=4&&r<.5?1:0;
  let sh=SH[Math.random()*SH.length|0],sk=SK[Math.random()*SK.length|0],hp=1+Math.floor(score/10),sv=.75+Math.random()*.3;
  if(ty==1){sh='#5a5a6a';sk='#c9d0b8';hp=1;sv*=1.1+Math.min(.5,score/120)}
  if(ty==2){sh='#2e5a2a';sk='#7ccf4a';hp=2;sv*=.85}
  e.push({x:x,y:y,ty:ty,hp:hp,mh:hp,ar:70+Math.min(60,score),wk:Math.random()*6,sv:sv,sh:sh,sk:sk});
},1000);

/* ---------- drawing characters ---------- */
function human(x,y,a,ch,wk,s,L,fl){
  g.save();g.translate(x,y);g.scale(s,s);
  el(2,3,20,17,'rgba(0,0,0,.35)');
  g.rotate(a);
  const sw=Math.sin(wk)*7;
  el(sw,-6,10,5.5,ch.pants);el(-sw,6,10,5.5,ch.pants);
  el(sw+8,-6,5,4.5,ch.boot);el(-sw+8,6,5,4.5,ch.boot);
  if(ch.pack){g.fillStyle=ch.pack;g.fillRect(-16,-9,9,18);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(-16,-9,9,3)}
  el(0,0,9,17,ch.shirt);
  if(ch.vest){el(0,0,7,13.5,ch.vest);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(2,-9,4,5);g.fillRect(2,4,4,5)}
  g.lineCap='round';g.lineWidth=6;g.strokeStyle=ch.shirt;
  g.beginPath();g.moveTo(1,-15);g.lineTo(22,-3);g.moveTo(1,15);g.lineTo(17,4);g.stroke();
  if(L>0){
    g.fillStyle='#4b5320';g.fillRect(-8,-5,42,10);
    g.fillStyle='#2a2a2a';g.fillRect(-11,-6.5,5,13);
    g.fillStyle='#c0392b';g.beginPath();g.moveTo(34,-5);g.lineTo(44,0);g.lineTo(34,5);g.fill();
  }else{
    g.fillStyle='#5a3a1e';g.fillRect(2,-3,10,6);
    g.fillStyle='#222';g.fillRect(10,-2.5,24,5);
    g.fillStyle='#111';g.fillRect(34,-1.2,9,2.4);
    g.fillStyle='#333';g.fillRect(16,2,5,5);
  }
  cc(22,-3,3.6,ch.skin);cc(17,4,3.6,ch.skin);
  if(fl>0&&!L){
    g.fillStyle=fl>3?'rgba(255,170,40,.95)':'rgba(255,210,80,.9)';
    const big=fl>3?17:12;
    g.beginPath();
    for(let i=0;i<10;i++){const r=i%2?4.5:big,t=i*Math.PI/5;g.lineTo(44+Math.cos(t)*r,Math.sin(t)*r)}
    g.closePath();g.fill();cc(44,0,4,'#fff');
  }
  el(-1,-8.6,2.4,2,ch.skin);el(-1,8.6,2.4,2,ch.skin);
  cc(0,0,8.6,ch.skin);
  if(ch.helm){
    cc(0,0,10.2,ch.helm);cc(-2,-3,4.5,'rgba(255,255,255,.14)');
    g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.5;g.beginPath();g.arc(0,0,10.2,0,7);g.stroke();
  }else{
    g.fillStyle=ch.hair;g.beginPath();g.arc(0,0,9,Math.PI*.45,Math.PI*1.55);g.closePath();g.fill();
  }
  g.restore();
}
function zom(q,a){
  g.save();g.translate(q.x,q.y);g.scale(1.3,1.3);
  el(2,3,20,17,'rgba(0,0,0,.35)');
  g.rotate(a+Math.sin(q.wk)*.1);
  if(q.ty==1)g.scale(1,.7); // thin zombie
  const sw=Math.sin(q.wk)*5,ar=Math.sin(q.wk*.7)*3;
